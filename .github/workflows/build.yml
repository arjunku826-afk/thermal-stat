name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libthermal_states.so (arm64-v8a)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package the mod folder
        run: |
          mkdir thermal-states
          cp manifest.json thermal-states/
          cp build/libthermal_states.so thermal-states/

      - uses: actions/upload-artifact@v4
        with:
          name: thermal-states
          path: thermal-states/
